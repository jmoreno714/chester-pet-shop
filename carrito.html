<body>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html">
      <img src="assets/img/logo-chester-mark.png" alt="Chester Pet Shop" width="159" height="167">
      Chester <span>PET SHOP</span>
    </a>
    <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-nav">
      <span></span><span></span><span></span>
    </button>
    <nav class="main-nav" id="main-nav" aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Catálogo</a>
      <a href="nosotros.html">Nosotros</a>
      <a class="btn btn-primary" href="productos.html">Hacer pedido</a>
    </nav>
  </div>
</header>

<main>
  <section class="page-hero wrap cart-hero">
    <div>
      <span class="eyebrow">Tu pedido</span>
      <h1>Carrito</h1>
    </div>
    <!-- arriba a la derecha, a la vista antes de la lista y del total (relacionados.js) -->
    <aside class="upsell" id="related" hidden aria-labelledby="upsell-title">
      <h2 class="upsell-title" id="upsell-title">Completá tu pedido</h2>
      <ul class="upsell-list" id="related-grid"></ul>
    </aside>
  </section>

  <div class="wrap">
    <div class="checkout-steps" style="--fill:0">
      <div class="checkout-track" aria-hidden="true">
        <div class="checkout-fill"></div>
        <div class="checkout-dog-rail"><img class="checkout-dog perro-bob" src="assets/img/perro-cabeza.png" alt=""></div>
      </div>
      <ol class="checkout-list" aria-label="Pasos del pedido">
        <li class="is-current" aria-current="step"><span class="checkout-dot">1</span><span class="checkout-label">Carrito</span></li>
        <li><span class="checkout-dot">2</span><span class="checkout-label">Tus datos</span></li>
        <li><span class="checkout-dot">3</span><span class="checkout-label">Enviar pedido</span></li>
      </ol>
    </div>
  </div>

  <section class="section" style="padding-top:0;">
    <div class="wrap cart-page" id="cart-page"></div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="fine-print" style="padding:0;border:0;margin:0;">
      <span>© <span id="year"></span> Chester Pet Shop</span>
      <span>Yerba Buena, Tucumán</span>
    </div>
  </div>
</footer>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
<script src="assets/js/main.js?v=202610062142"></script>
<script src="assets/js/cart.js?v=202610062142"></script>
<script src="assets/js/qty-elastic.js?v=202610062142"></script>
<script src="assets/js/relacionados.js?v=202610062142"></script>
</body>
</html>
