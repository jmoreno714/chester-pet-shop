<!doctype html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producto — Chester Pet Shop</title>
<meta name="description" content="Ficha de producto — Chester Pet Shop, Yerba Buena, Tucumán.">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html">
      <img src="assets/img/logo-chester.png" alt="Chester Pet Shop" width="40" height="40">
      Chester <span>PET SHOP</span>
    </a>
    <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-nav">
      <span></span><span></span><span></span>
    </button>
    <nav class="main-nav" id="main-nav" aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Catálogo</a>
      <a href="nosotros.html">Nosotros</a>
      <a href="contacto.html">Contacto</a>
      <a class="btn btn-primary" href="contacto.html">Hacer pedido</a>
    </nav>
  </div>
</header>

<main>
  <section class="section product-detail-section">
    <div class="wrap" id="product-detail">
      <nav class="breadcrumb" aria-label="Migas de pan">
        <a href="index.html">Inicio</a>
        <span>//</span>
        <a href="productos.html">Catálogo</a>
        <span>//</span>
        <a id="pd-breadcrumb-cat" href="productos.html"></a>
        <span>//</span>
        <span id="pd-breadcrumb-nombre"></span>
      </nav>

      <div class="product-detail">
        <div class="product-gallery">
          <div class="product-gallery-main">foto del producto<br>(a definir)</div>
        </div>

        <div class="product-info">
          <p class="product-brand" id="pd-marca"></p>
          <h1 id="pd-titulo"></h1>
          <p class="product-price" id="pd-precio"></p>
          <div class="product-variants" id="pd-variants"></div>

          <div class="product-qty">
            <button type="button" class="qty-btn" id="pd-qty-dec" aria-label="Restar">−</button>
            <input type="number" id="pd-qty" value="1" min="1" aria-label="Cantidad">
            <button type="button" class="qty-btn" id="pd-qty-inc" aria-label="Sumar">+</button>
          </div>

          <button type="button" class="btn btn-primary btn-add-cart" id="pd-add-cart">Añadir al carrito</button>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="fine-print" style="padding:0;border:0;margin:0;">
      <span>© <span id="year"></span> Chester Pet Shop</span>
      <span>Yerba Buena, Tucumán</span>
    </div>
  </div>
</footer>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
<script src="assets/js/main.js"></script>
<script src="assets/js/producto.js"></script>
</body>
</html>
