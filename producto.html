<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,800;1,500;1,600&amp;family=Newsreader:ital,wght@0,400;0,600;1,400&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<link rel="stylesheet" href="assets/css/style.css?v=202610061248">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html">
      <img src="assets/img/logo-chester-mark.png" alt="Chester Pet Shop" width="159" height="167">
      Chester <span>PET SHOP</span>
    </a>
    <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="main-nav">
      <span></span><span></span><span></span>
    </button>
    <nav class="main-nav" id="main-nav" aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Catálogo</a>
      <a href="nosotros.html">Nosotros</a>
      <a class="btn btn-primary" href="productos.html">Hacer pedido</a>
    </nav>
  </div>
</header>

<main>
  <section class="section product-detail-section">
    <div class="wrap" id="product-detail">
      <nav class="breadcrumb" aria-label="Migas de pan">
        <a href="index.html">Inicio</a>
        <span>//</span>
        <a href="productos.html">Catálogo</a>
        <span>//</span>
        <a id="pd-breadcrumb-cat" href="productos.html"></a>
        <span>//</span>
        <span id="pd-breadcrumb-nombre"></span>
      </nav>

      <div class="product-detail">
        <div class="product-gallery">
          <div class="product-gallery-main">foto del producto<br>(a definir)</div>
        </div>

        <div class="product-info">
          <p class="product-brand" id="pd-marca"></p>
          <h1 id="pd-titulo"></h1>
          <p class="product-price" id="pd-precio"></p>
          <!-- pesos y cantidad comparten eje: el −/+ se centra bajo los pesos -->
          <div class="product-buy">
            <div class="product-variants" id="pd-variants"></div>

            <div class="qty-elastic" id="pd-qty-elastic" role="group" aria-label="Cantidad">
              <span class="qty-elastic-sign" data-dir="-1" role="button" tabindex="0" aria-label="Restar">−</span>
              <span class="qty-elastic-track">
                <span class="qty-elastic-knob" id="pd-qty">1</span>
              </span>
              <span class="qty-elastic-sign" data-dir="1" role="button" tabindex="0" aria-label="Sumar">+</span>
            </div>

          </div>

          <button type="button" class="btn btn-primary btn-add-cart" id="pd-add-cart">Añadir al carrito</button>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="fine-print" style="padding:0;border:0;margin:0;">
      <span>© <span id="year"></span> Chester Pet Shop</span>
      <span>Yerba Buena, Tucumán</span>
    </div>
  </div>
</footer>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>

</body>
